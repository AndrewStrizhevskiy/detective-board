name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.4"
  PYTHON_VERSION: "3.12"  # same as .python-version

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      # No Ollama in CI: `live` and `e2e` are excluded. 80 is a placeholder for core.
      - run: >
          uv run pytest -m "not live and not e2e"
          --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node is preinstalled on ubuntu-latest; `just` is not, so the command is spelled out
      # (keep in sync with `just test-web`).
      - run: node --test tests/web_js/*.test.mjs
      # every vendored script, stylesheet and font matches the sha256 in web/vendor/README.md
      - run: python3 scripts/check_vendor_hashes.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # `just run --fake` spelled out (no `just` on the runner): the app starts, binds to loopback
      # only, serves the page with its CSP, answers one question and refuses an out-of-corpus one
      - name: just run --fake
        run: |
          uv run python -m detective_board.api --fake --port 8765 > api.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/api/health | grep -q '"status":"ok"'
          curl -sfI http://127.0.0.1:8765/ | grep -qi '^content-security-policy:'
          grep -q 'Uvicorn running on http://127.0.0.1:8765' api.log
          ask() { curl -sfN -X POST http://127.0.0.1:8765/api/ask -H 'content-type: application/json' -d "{\"question\": \"$1\"}"; }
          ask 'What is a swamp adder?' | grep -q '"type":"final","status":"answered"'
          ask 'What is the weather in Paris today?' | grep -q '"type":"final","status":"refused"'
      - if: failure()
        run: cat api.log

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # known vulnerabilities in the shipped (runtime) dependencies, exactly as locked
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --no-header -o requirements.txt
      - run: uvx pip-audit@2.10.1 -r requirements.txt --require-hashes --disable-pip --progress-spinner off

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the whole history, not only the last commit
      # gitleaks 8.30.1, the linux x64 release checked against its published sha256
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .

  eval-short:
    runs-on: ubuntu-latest
    needs: [test]
    # eval/run_eval.py --short: 8 dev questions, FakeLLM, the 10-chunk fixture index, no network,
    # well under 60 s. It tests the pipeline and the metric code, not model quality (docs/test-plan.md 7).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python eval/run_eval.py --short
